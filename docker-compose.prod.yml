services:
  db-storage-init:
    image: postgres:18-alpine
    user: root
    entrypoint: ["sh", "-ec"]
    command: ["mkdir -p /wal-archive /basebackups; chown postgres:postgres /wal-archive /basebackups; chmod 0700 /wal-archive /basebackups"]
    volumes:
      - hms_wal_archive:/wal-archive
      - hms_basebackups:/basebackups
    restart: "no"
  db:
    image: postgres:18-alpine
    container_name: hms-db
    depends_on:
      db-storage-init:
        condition: service_completed_successfully
    command: ["postgres", "-c", "wal_level=replica", "-c", "archive_mode=on", "-c", "archive_timeout=60", "-c", 'archive_command=sh /usr/local/bin/hms-archive-wal "%p" "%f"']
    restart: unless-stopped
    environment:
      POSTGRES_DB: hms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - hms_pgdata18:/var/lib/postgresql
      - ./scripts/archive-wal.sh:/usr/local/bin/hms-archive-wal:ro
      - hms_wal_archive:/wal-archive
      - hms_basebackups:/basebackups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hms"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  migrate:
    build:
      context: ./backend
    container_name: hms-migrate
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: hms
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    # Production never loads demo data.
    command: ["node", "migrate.js", "up"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # The application never connects as the owner (A2): this one-time step creates
  # the restricted runtime role after migrations. Re-running it is harmless.
  runtime-role:
    build:
      context: ./backend
    container_name: hms-runtime-role
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: hms
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      RUNTIME_DB_USER: ${RUNTIME_DB_USER:-hms_runtime}
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?Set RUNTIME_DB_PASSWORD in .env (16+ characters)}
    command: ["node", "scripts/provision-runtime-role.cjs"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  backend:
    build:
      context: ./backend
    container_name: hms-backend
    restart: unless-stopped
    depends_on:
      runtime-role:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 5001
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: hms
      # Restricted runtime identity (A2): no table ownership, no row-policy bypass, no schema creation.
      DB_USER: ${RUNTIME_DB_USER:-hms_runtime}
      DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?Set RUNTIME_DB_PASSWORD in .env (16+ characters)}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: 8h
      CORS_ORIGIN: "*"
      FRONTEND_URL: http://localhost:4999
      AADHAAR_ENCRYPTION_KEY: ${AADHAAR_ENCRYPTION_KEY:?Set AADHAAR_ENCRYPTION_KEY in .env - must match the key existing data was encrypted with}
      # Data keyring (A4): new values use the first key; older keys stay listed until rekeyed.
      HMS_DATA_KEYS: ${HMS_DATA_KEYS:?Set HMS_DATA_KEYS in .env (id:64-hex keys) - personal data is not encrypted with a development key}
      HMS_DOCUMENT_DIR: /app/private-documents
      # Documents are not available without a virus scanner (A4): set CLAMAV_HOST to the scanner.
      HMS_REQUIRE_SCANNER: "true"
      UPLOAD_DIR: ./uploads
      MAX_FILE_SIZE_MB: 5
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_AUTH: 20
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-}
      TRUST_PROXY: "1"
      # Ship this directory to write-once storage the database administrators
      # cannot alter (for example an S3 bucket with Object Lock).
      AUDIT_CHECKPOINT_DIR: /app/audit-checkpoints
      AUDIT_CHECKPOINT_KEY: ${AUDIT_CHECKPOINT_KEY:?Set AUDIT_CHECKPOINT_KEY in .env}
    ports:
      - "5001:5001"
    volumes:
      - hms_uploads:/app/uploads
      - hms_audit_checkpoints:/app/audit-checkpoints
      - hms_private_documents:/app/private-documents
    command: ["sh", "startup.sh"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5001/api/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M

  frontend:
    build:
      context: ./frontend
    container_name: hms-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4999:4999"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:4999/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
        reservations:
          cpus: '0.10'
          memory: 32M

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: hms-prometheus
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - hms_promdata:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  grafana:
    image: grafana/grafana:10.4.0
    container_name: hms-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
      - hms_grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - db
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

volumes:
  hms_private_documents:
  hms_wal_archive:
  hms_basebackups:
  hms_pgdata18:
  hms_audit_checkpoints:
  hms_pgdata:
  hms_uploads:
  hms_promdata:
  hms_grafanadata:
