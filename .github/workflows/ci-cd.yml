name: HMS CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Stage 1: Automated Unit & Build Verification
  test-and-verify:
    name: Lint, Test & Asset Compilation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Check Typed Clinical Contracts
        run: cd backend && npm run typecheck

      - name: Backend Unit Tests
        run: |
          cd backend
          npm test

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Compile Frontend Production Build (Vite)
        run: |
          cd frontend
          npm run build

  # Stage 1b: Database migrations build the same schema from scratch and from
  # a database created the pre-migration way, on each supported PostgreSQL.
  migrations:
    name: Database Migrations (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: ['16', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # verify-migrations.sh reads the legacy init script from history

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: cd backend && npm ci

      - name: Verify Migrations
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: backend/scripts/verify-migrations.sh

  phase1-acceptance:
    name: Phase 1 Failure and Transaction Acceptance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hms_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: hms_ci
      HMS_TEST_DATABASE: 'true'
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: backend
      - run: node migrate.js up && node seed_demo_data.js
        working-directory: backend
      - run: npm test
        working-directory: backend

  # Stage 2: Container Image Build Verification
  docker-build-check:
    name: Docker Container Build & Topology Verification
    needs: [test-and-verify, migrations, phase1-acceptance]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Topology
        env:
          DB_PASSWORD: ci-placeholder
          JWT_SECRET: ci-placeholder
          AADHAAR_ENCRYPTION_KEY: ci-placeholder
          AUDIT_CHECKPOINT_KEY: ci-placeholder
        run: |
          docker compose -f docker-compose.prod.yml config

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: hms-backend:ci-check

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: hms-frontend:ci-check

  # Verification publishes a reviewable candidate. It never replaces a running
  # hospital or changes a database merely because a branch was pushed.
  release-candidate:
    name: Publish Verified Candidate Metadata
    needs: docker-build-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create candidate record
        run: |
          mkdir -p release-candidate
          git rev-parse HEAD > release-candidate/commit.txt
          sha256sum backend/migrations/*.sql > release-candidate/migrations.sha256
          cp docs/CLINICAL_COMPLETION.md release-candidate/
      - uses: actions/upload-artifact@v4
        with:
          name: clinical-release-${{ github.sha }}
          path: release-candidate/
