services:
  backend:
    build:
      context: ./backend
    container_name: hms-backend
    user: "1000:1000"
    env_file:
      - ./backend/.env
    ports:
      - "5001:5001"
    volumes:
      - ./backend/uploads:/app/uploads
      # Talk to PostgreSQL over Unix socket or host gateway
      - /var/run/postgresql:/var/run/postgresql
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    command: ["sh", "startup.sh"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M

  frontend:
    build:
      context: ./frontend
    container_name: hms-frontend
    ports:
      - "4999:4999"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:4999/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
        reservations:
          cpus: '0.10'
          memory: 32M
