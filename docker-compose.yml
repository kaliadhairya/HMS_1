services:
  db-storage-init:
    image: postgres:16-alpine
    user: root
    entrypoint: ["sh", "-ec"]
    command: ["mkdir -p /wal-archive /basebackups; chown postgres:postgres /wal-archive /basebackups; chmod 0700 /wal-archive /basebackups"]
    volumes:
      - hms-wal-archive:/wal-archive
      - hms-basebackups:/basebackups
    restart: "no"
  db:
    image: postgres:16-alpine
    container_name: hms-db
    depends_on:
      db-storage-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${DB_NAME:-hms}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_HOST_PORT:-5434}:5432"
    # Continuous WAL archiving for point-in-time restore (Phase 6G): a segment
    # is requested at least every 60 s. Actual RPO depends on observed
    # successful archival and protected copies; failures must alert. Base backups:
    # scripts/pitr-basebackup.sh; drill: scripts/pitr-restore-drill.sh.
    # Copy hms-wal-archive and hms-basebackups off this host as well.
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=60
      - -c
      - archive_command=sh /usr/local/bin/hms-archive-wal "%p" "%f"
    volumes:
      - hms-db-data:/var/lib/postgresql/data
      - ./scripts/archive-wal.sh:/usr/local/bin/hms-archive-wal:ro
      - hms-wal-archive:/wal-archive
      - hms-basebackups:/basebackups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-hms}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
    container_name: hms-migrate
    environment:
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-hms}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-true}
    # Applies pending migrations, then (development only) demo data.
    command: ["sh", "-c", "node migrate.js up && if [ \"$$SEED_DEMO_DATA\" = true ]; then node seed_demo_data.js; fi"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    container_name: hms-backend
    environment:
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-hms}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - PORT=5001
      - CORS_ORIGIN=*
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:4999}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env - see .env.example}
      - AADHAAR_ENCRYPTION_KEY=${AADHAAR_ENCRYPTION_KEY:-cd9da93cb9ff3ccd87b4b2da30920bd5ac549e7470423996345cbde3ff5b986a0}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-}
      # Signed audit checkpoints (see docs/phase1). In development they land in
      # ./audit-checkpoints; production must ship them to storage the database
      # administrators cannot rewrite.
      - AUDIT_CHECKPOINT_DIR=/app/audit-checkpoints
      - AUDIT_CHECKPOINT_KEY=${AUDIT_CHECKPOINT_KEY:-}
    ports:
      - "5001:5001"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./audit-checkpoints:/app/audit-checkpoints
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    command: ["sh", "startup.sh"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:5001/api/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M

  frontend:
    build:
      context: ./frontend
    container_name: hms-frontend
    ports:
      - "4999:4999"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:4999/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
        reservations:
          cpus: '0.10'
          memory: 32M

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: hms-prometheus
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - hms-prom-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  grafana:
    image: grafana/grafana:10.4.0
    container_name: hms-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
      - hms-grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
      - db
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

volumes:
  hms-db-data:
  hms-wal-archive:
  hms-basebackups:
  hms-prom-data:
  hms-grafana-data:
