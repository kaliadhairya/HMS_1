apiVersion: 1

datasources:
  - name: Prometheus
    uid: hms-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: PostgreSQL (HMS)
    uid: hms-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: db:5432
    user: ${HMS_GRAFANA_DB_USER}
    secureJsonData:
      password: ${HMS_GRAFANA_DB_PASSWORD}
    jsonData:
      database: ${HMS_GRAFANA_DB_NAME}
      sslmode: 'disable'
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1600
    editable: true
